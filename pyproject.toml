[project]
name = "aletheia"
version = "0.0.1"
description = "Aletheia — a neuro-symbolic, multi-agent Glass Box AI system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aletheia*"]

[tool.setuptools.package-data]
"aletheia.safety" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
